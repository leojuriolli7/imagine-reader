name: imagine-reader
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imagine
      POSTGRES_PASSWORD: imagine_local
      POSTGRES_DB: imagine_reader
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagine -d imagine_reader"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
volumes:
  postgres_data:
