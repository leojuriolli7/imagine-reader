name: imagine-observability
services:
  lgtm:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "127.0.0.1:53000:3000"
      - "127.0.0.1:54318:4318"
      - "127.0.0.1:53200:3200"
      - "127.0.0.1:53100:3100"
    volumes:
      - telemetry:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
volumes:
  telemetry:
