receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  file/traces:
    path: /data/traces.jsonl
    rotation:
      max_megabytes: 5
      max_backups: 2
      max_days: 1
  file/logs:
    path: /data/logs.jsonl
    rotation:
      max_megabytes: 5
      max_backups: 2
      max_days: 1
  file/metrics:
    path: /data/metrics.jsonl
    rotation:
      max_megabytes: 5
      max_backups: 2
      max_days: 1
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/metrics]
