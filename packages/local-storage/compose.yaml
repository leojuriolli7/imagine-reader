name: imagine-reader-storage
services:
  s3:
    image: chrislusf/seaweedfs:4.45
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: imagine-local
      AWS_SECRET_ACCESS_KEY: imagine-local-secret
      S3_BUCKET: imagine-reader,imagine-reader-test
    ports: ["127.0.0.1:58333:8333"]
    volumes: ["s3_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  s3_data:
